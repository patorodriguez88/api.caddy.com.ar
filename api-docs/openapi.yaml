openapi: 3.0.3
info:
  title: API Caddy
  description: Documentación de la API de Caddy para autenticación, servicios y tarifas.
  version: "1.0.0"

servers:
  - url: https://www.caddy.com.ar/sandbox/api
    description: Sandbox
  - url: https://www.caddy.com.ar/api
    description: Producción

tags:
  - name: Autenticación
    description: Login y manejo de tokens
  - name: Servicios
    description: Operaciones relacionadas a la gestión de servicios (listado, consulta y creación)
  - name: Tarifas
    description: Cotización de tarifas (consulta por GET, sin modificar recursos)

paths:
  /auth:
    post:
      tags: [Autenticación]
      summary: Login de usuario
      description: Devuelve un token de autenticación válido para usar en los demás endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usuario:
                  type: string
                  example: mcisterna
                password:
                  type: string
                  example: 123456
      responses:
        "200":
          description: Token generado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 628bdb405bf8ed31b1af72f999d10e75
        "401":
          description: Usuario o contraseña inválidos

  /servicios:
    get:
      tags: [Servicios]
      summary: Listado de servicios
      description: Devuelve los servicios disponibles con filtros de estado y paginación.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          example: 1
        - name: token
          in: query
          schema:
            type: string
          required: true
        - name: estado
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Estado de los servicios
      responses:
        "200":
          description: Lista de servicios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    nombre: { type: string }
                    estado: { type: string }

  /servicios/{codigo}:
    get:
      tags: [Servicios]
      summary: Consulta servicio por Código de Seguimiento
      description: Devuelve la información de un servicio específico.
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: INPRAZOKW
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Información del servicio
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  codigo: { type: string }
                  estado: { type: string }
        "404":
          description: Servicio no encontrado

  /sandbox/api/servicios:
    post:
      tags: [Servicios]
      summary: Crear un servicio
      description: |
        Permite registrar un nuevo servicio.
        Requiere un `token` válido obtenido desde el endpoint de login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NombreCompleto: { type: string }
                Direccion: { type: string }
                Ciudad: { type: string }
                CodigoPostal: { type: string }
                token: { type: string }
                Dni: { type: string }
                Mail: { type: string }
                Telefono: { type: string }
                Cantidad: { type: integer }
                Servicio: { type: integer }
                ValorDeclarado: { type: string }
                Cobranza: { type: string }
                idProveedor: { type: string }
                Observaciones: { type: string }
                Origen:
                  type: array
                  items:
                    type: object
                    properties:
                      idProveedor: { type: string }
                      Nombre: { type: string }
                      Direccion: { type: string }
                Box:
                  type: array
                  items:
                    type: object
                    properties:
                      Length: { type: string }
                      Width: { type: string }
                      Height: { type: string }
                      Weight: { type: string }
              example:
                NombreCompleto: "Elsa Fig"
                Direccion: "MI CASA"
                Ciudad: "TURRADO JUAREZ 1377"
                CodigoPostal: "5000"
                token: "628bdb405bf8ed31b1af72f999d10e75"
                Dni: "223334434"
                Mail: "prodriguez@caddy.com.ar"
                Telefono: "0351152462825"
                Cantidad: 1
                Servicio: 3
                ValorDeclarado: "10000"
                Cobranza: "107690"
                idProveedor: "I2757268"
                Observaciones: "ELSA VIVE EN UNA CASA COLOR GRIS..."
                Origen:
                  - idProveedor: ""
                    Nombre: ""
                    Direccion: ""
                Box:
                  - Length: "10"
                    Width: "10"
                    Height: "10"
                    Weight: "10"
      responses:
        "200":
          description: Servicio creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, example: 12345 }
                  codigoSeguimiento: { type: string, example: "INPRAZOKW" }
                  estado: { type: string, example: "Cargada" }
      x-codeSamples:
        - lang: cURL
          label: cURL Example
          source: |
            curl --location 'https://www.caddy.com.ar/sandbox/api/servicios' \
            --header 'Content-Type: application/json' \
            --data-raw '{
              "NombreCompleto" : "Elsa Fig",
              "Direccion" : "MI CASA",
              "Ciudad" : "TURRADO JUAREZ 1377",
              "CodigoPostal": "5000",
              "token" : "628bdb405bf8ed31b1af72f999d10e75",
              "Dni" : "223334434",
              "Mail":"prodriguez@caddy.com.ar",
              "Telefono" : "0351152462825",
              "Cantidad" : 1,
              "Servicio" : 3,
              "ValorDeclarado" : "10000",
              "Cobranza" : "107690",
              "idProveedor" : "I2757268",
              "Observaciones" : "ELSA VIVE EN UNA CASA COLOR GRIS...",
              "Origen" : [
                { "idProveedor": "", "Nombre": "", "Direccion": "" }
              ],
              "Box" : [
                { "Length" : "10", "Width" : "10", "Height" : "10", "Weight" : "10" }
              ]
            }'
        - lang: Java
          label: Java OkHttp
          source: |
            OkHttpClient client = new OkHttpClient().newBuilder()
              .build();
            MediaType mediaType = MediaType.parse("application/json");
            RequestBody body = RequestBody.create(mediaType, "{\n\"NombreCompleto\" : \"Elsa Fig\", ... }");
            Request request = new Request.Builder()
              .url("https://www.caddy.com.ar/sandbox/api/servicios")
              .method("POST", body)
              .addHeader("Content-Type", "application/json")
              .build();
            Response response = client.newCall(request).execute();

  /tarifas/cotizar:
    get:
      tags: [Tarifas]
      summary: Cotización de tarifa (GET)
      description: >
        Calcula la tarifa en base al código postal de destino, dimensiones, peso y servicio.
        No modifica recursos (solo lectura). Requiere `token` válido.
      parameters:
        - name: token
          in: query
          required: true
          description: Token de sesión del cliente (usuarios_token.Activo)
          schema:
            type: string
            example: 628bdb405bf8ed31b1af72f999d10e75
        - name: cp
          in: query
          required: true
          description: Código Postal de destino (alias CodigoPostal). Capital (5000–5023) se normaliza a 5000.
          schema:
            type: string
            example: "5014"
        - name: length
          in: query
          required: true
          schema: { type: number, format: float, example: 0.40 }
        - name: width
          in: query
          required: true
          schema: { type: number, format: float, example: 0.30 }
        - name: height
          in: query
          required: true
          schema: { type: number, format: float, example: 0.20 }
        - name: weight
          in: query
          required: true
          schema: { type: number, format: float, example: 2.5 }
        - name: localidad
          in: query
          description: Nombre de la localidad de destino (para label en respuesta)
          schema: { type: string, example: "Villa Allende" }
        - name: servicio
          in: query
          description: Tipo de servicio (1=Retiro y Entrega, 3=Flex)
          schema: { type: integer, enum: [1, 3], default: 1, example: 1 }
        - name: cantidad
          in: query
          description: Cantidad de bultos (default 1)
          schema: { type: integer, minimum: 1, default: 1, example: 1 }
        - name: valorDeclarado
          in: query
          description: Valor declarado (se aplica seguro mínimo configurable)
          schema: { type: number, format: float, default: 0, example: 10000 }
        - name: flex
          in: query
          description: Forzar cálculo como Flex (0/1). Si =1 o servicio=3 y CP es Capital, usa tarifa FLEX.
          schema: { type: integer, enum: [0, 1], default: 0, example: 0 }
      responses:
        "200":
          description: Cotización calculada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      Id: { type: integer, example: 12345 }
                      Servicio: { type: string, example: "Retiro y Entrega" }
                      Fecha_Entrega: { type: string, example: "Viernes" }
                      Localidad: { type: string, example: "Villa Allende" }
                      Distancia: { type: string, example: "Hasta 12 km." }
                      Cantidad: { type: integer, example: 1 }
                      Valor_Declarado: { type: number, example: 10000 }
                      Titulo: { type: string, example: "Zona Norte - Web" }
                      Tarifa: { type: integer, example: 1850 }
                      Seguro: { type: number, example: 120 }
                      Total: { type: integer, example: 1970 }
                      Codigo: { type: string, example: "ZN-12" }
              examples:
                ejemploInterior:
                  summary: No Flex / Interior
                  value:
                    result:
                      Id: 98765
                      Servicio: "Retiro y Entrega"
                      Fecha_Entrega: "Jueves"
                      Localidad: "Villa Allende"
                      Distancia: "Hasta 12 km."
                      Cantidad: 1
                      Valor_Declarado: 10000
                      Titulo: "Zona Norte - Web"
                      Tarifa: 1850
                      Seguro: 120
                      Total: 1970
                      Codigo: "ZN-12"
                ejemploFlexCapital:
                  summary: Flex en Capital
                  value:
                    result:
                      Id: 12346
                      Servicio: "Retiro y Entrega"
                      Fecha_Entrega: "Hoy"
                      Localidad: "Cordoba Capital"
                      Distancia: "Hasta 10 km."
                      Cantidad: 1
                      Valor_Declarado: 5000
                      Titulo: "Flex - Capital"
                      Tarifa: 1200
                      Seguro: 0
                      Total: 1200
                      Codigo: "183"
        "400":
          description: Parámetros inválidos o no se pudo obtener precio
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      error_id: { type: integer, example: 400 }
                      error_msg:
                        { type: string, example: "Faltan datos del paquete" }
        "401":
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      error_id: { type: integer, example: 401 }
                      error_msg:
                        {
                          type: string,
                          example: "El Token que envió es inválido o ha caducado",
                        }
      x-codeSamples:
        - lang: cURL
          label: cURL (Interior)
          source: |
            curl --get 'https://www.caddy.com.ar/sandbox/api/tarifas/cotizar' \
              --data-urlencode 'token=628bdb405bf8ed31b1af72f999d10e75' \
              --data-urlencode 'cp=5014' \
              --data-urlencode 'length=0.4' \
              --data-urlencode 'width=0.3' \
              --data-urlencode 'height=0.2' \
              --data-urlencode 'weight=2.5' \
              --data-urlencode 'localidad=Villa Allende' \
              --data-urlencode 'servicio=1' \
              --data-urlencode 'cantidad=1' \
              --data-urlencode 'valorDeclarado=10000'
        - lang: cURL
          label: cURL (Flex Capital)
          source: |
            curl --get 'https://www.caddy.com.ar/sandbox/api/tarifas/cotizar' \
              --data-urlencode 'token=628bdb405bf8ed31b1af72f999d10e75' \
              --data-urlencode 'cp=5004' \
              --data-urlencode 'length=0.3' \
              --data-urlencode 'width=0.3' \
              --data-urlencode 'height=0.3' \
              --data-urlencode 'weight=1' \
              --data-urlencode 'localidad=Cordoba' \
              --data-urlencode 'servicio=3' \
              --data-urlencode 'flex=1'

components:
  securitySchemes:
    ApiKeyQuery:
      type: apiKey
      in: query
      name: token
